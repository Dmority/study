[project]
name = "adot-todo-backend"
version = "1.0.0"
description = "Todo application backend for ADOT study"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.2",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "pydantic-settings>=2.1.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "aws-opentelemetry-distro>=0.2.0",
]
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]