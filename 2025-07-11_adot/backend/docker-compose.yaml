version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_DB: adotdb
      POSTGRES_USER: adotuser
      POSTGRES_PASSWORD: adotpass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adotuser -d adotdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - todo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=adotdb
      - DB_USERNAME=adotuser
      - DB_PASSWORD=adotpass
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - todo-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: todo-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - todo-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  todo-network:
    driver: bridge