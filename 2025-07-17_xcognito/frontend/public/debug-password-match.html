<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Match Debug</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Password Match Debug</h2>
        
        <form id="testForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="test@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="TestPassword123!" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" value="TestPassword123!" required>
            </div>
            <button type="submit" class="btn btn-primary">Test Password Match</button>
        </form>
        
        <div class="form-group">
            <h3>Test Different Passwords:</h3>
            <button type="button" onclick="testMismatch()">Test Mismatch</button>
            <button type="button" onclick="testMatch()">Test Match</button>
        </div>
        
        <div id="output" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f5f5f5;">
            <h3>Debug Output:</h3>
            <pre id="debugOutput"></pre>
        </div>
    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
    <script src="src/js/config.js"></script>
    <script src="src/js/ui.js"></script>
    
    <script>
        const output = document.getElementById('debugOutput');
        
        function log(message, data = null) {
            const timestamp = new Date().toISOString();
            const logEntry = `[${timestamp}] ${message}`;
            if (data) {
                output.textContent += logEntry + '\n' + JSON.stringify(data, null, 2) + '\n\n';
            } else {
                output.textContent += logEntry + '\n\n';
            }
            console.log(logEntry, data);
        }
        
        function testMismatch() {
            document.getElementById('password').value = 'TestPassword123!';
            document.getElementById('confirmPassword').value = 'DifferentPassword123!';
            log('Set passwords to mismatch');
        }
        
        function testMatch() {
            document.getElementById('password').value = 'TestPassword123!';
            document.getElementById('confirmPassword').value = 'TestPassword123!';
            log('Set passwords to match');
        }
        
        document.getElementById('testForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = e.target;
            
            if (typeof uiHelper === 'undefined') {
                log('ERROR: uiHelper not available');
                return;
            }
            
            if (typeof VALIDATION_RULES === 'undefined') {
                log('ERROR: VALIDATION_RULES not available');
                return;
            }
            
            const formData = new FormData(form);
            log('Form data:', Object.fromEntries(formData));
            
            try {
                const validation = uiHelper.validateForm(form, VALIDATION_RULES.signup);
                log('Validation result:', validation);
                
                if (validation.isValid) {
                    log('✅ VALIDATION PASSED! You can now sign up.');
                } else {
                    log('❌ Validation failed:', validation.errors);
                }
                
            } catch (error) {
                log('Exception during validation:', error.message);
            }
        });
    </script>
</body>
</html>
