<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug CORS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Debug CORS Test</h2>
        
        <div class="form-group">
            <label for="tokenInput">ID Token:</label>
            <textarea id="tokenInput" rows="4" placeholder="Paste your ID token here"></textarea>
        </div>
        
        <div class="form-group">
            <button onclick="testCORS()">Test CORS Request</button>
            <button onclick="testOptions()">Test OPTIONS Request</button>
        </div>
        
        <div id="output" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f5f5f5;">
            <h3>Debug Output:</h3>
            <pre id="debugOutput"></pre>
        </div>
    </div>
    
    <script>
        const output = document.getElementById('debugOutput');
        
        function log(message, data = null) {
            const timestamp = new Date().toISOString();
            const logEntry = `[${timestamp}] ${message}`;
            if (data) {
                output.textContent += logEntry + '\n' + JSON.stringify(data, null, 2) + '\n\n';
            } else {
                output.textContent += logEntry + '\n\n';
            }
            console.log(logEntry, data);
        }
        
        async function testOptions() {
            log('Testing OPTIONS request...');
            try {
                const response = await fetch('https://56aqgp74wi.execute-api.us-east-1.amazonaws.com/dev/emotion', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'https://d3nlbhz9n843al.cloudfront.net',
                        'Access-Control-Request-Method': 'GET',
                        'Access-Control-Request-Headers': 'Authorization'
                    }
                });
                
                log('OPTIONS Response Status:', response.status);
                log('OPTIONS Response Headers:', Object.fromEntries(response.headers.entries()));
                
                const text = await response.text();
                log('OPTIONS Response Body:', text);
                
            } catch (error) {
                log('OPTIONS Request Error:', error.message);
            }
        }
        
        async function testCORS() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                log('Please enter an ID token');
                return;
            }
            
            log('Testing CORS request with token...');
            try {
                const response = await fetch('https://56aqgp74wi.execute-api.us-east-1.amazonaws.com/dev/emotion', {
                    method: 'GET',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors'
                });
                
                log('GET Response Status:', response.status);
                log('GET Response Headers:', Object.fromEntries(response.headers.entries()));
                
                if (response.ok) {
                    const data = await response.json();
                    log('GET Response Data:', data);
                } else {
                    const text = await response.text();
                    log('GET Response Error Body:', text);
                }
                
            } catch (error) {
                log('GET Request Error:', error.message);
                log('Error details:', error);
            }
        }
        
        // Pre-populate with current session token if available
        window.addEventListener('load', () => {
            if (typeof authService !== 'undefined' && authService.currentUser) {
                authService.currentUser.getSession((err, session) => {
                    if (!err && session) {
                        document.getElementById('tokenInput').value = session.getIdToken().getJwtToken();
                        log('Auto-populated token from current session');
                    }
                });
            }
        });
    </script>
</body>
</html>
