<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1>My Todos</h1>
                <div class="header-actions">
                    <span class="user-info" id="userInfo">Welcome, <span id="userName">User</span></span>
                    <button class="btn btn-secondary" id="logoutBtn">Logout</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Add Todo Form -->
            <div class="add-todo-section">
                <h2>Add New Todo</h2>
                <form id="addTodoForm" class="add-todo-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="todoTitle">Title</label>
                            <input type="text" id="todoTitle" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="todoDueDate">Due Date</label>
                            <input type="date" id="todoDueDate" name="dueDate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="todoDescription">Description</label>
                        <textarea id="todoDescription" name="description" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Todo</button>
                </form>
            </div>

            <!-- Emote Section -->
            <div class="emote-section">
                <h2>Daily Emotion</h2>
                <div class="emote-container">
                    <div class="emote-display" id="emoteDisplay">
                        <div class="emote-icon">😊</div>
                        <div class="emote-text" id="emoteText">Click below to get your emotion!</div>
                        <div class="emote-timestamp" id="emoteTimestamp"></div>
                    </div>
                    <div class="emote-actions">
                        <button class="btn btn-primary" id="getEmotionBtn">Get Random Emotion</button>
                        <button class="btn btn-secondary" id="getAllEmotionsBtn">View All Emotions</button>
                    </div>
                </div>
            </div>

            <!-- Todo Filters -->
            <div class="todo-filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="sort-options">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="createdAt">Created Date</option>
                        <option value="dueDate">Due Date</option>
                        <option value="title">Title</option>
                    </select>
                </div>
            </div>

            <!-- Todo List -->
            <div class="todo-list-section">
                <div class="todo-list" id="todoList">
                    <!-- Todos will be dynamically inserted here -->
                </div>
                
                <!-- Empty state -->
                <div class="empty-state hidden" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>No todos yet</h3>
                    <p>Add your first todo above to get started!</p>
                </div>
            </div>
        </main>

        <!-- Edit Todo Modal -->
        <div class="modal hidden" id="editTodoModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Todo</h3>
                    <button class="modal-close" id="editModalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="editTodoForm">
                        <div class="form-group">
                            <label for="editTodoTitle">Title</label>
                            <input type="text" id="editTodoTitle" name="title" required>
                        </div>
                        <div class="form-group">
                            <label for="editTodoDescription">Description</label>
                            <textarea id="editTodoDescription" name="description" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="editTodoDueDate">Due Date</label>
                            <input type="date" id="editTodoDueDate" name="dueDate">
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="editTodoCompleted" name="completed">
                                Mark as completed
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="editModalCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="editModalSave">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal hidden" id="deleteTodoModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Delete Todo</h3>
                    <button class="modal-close" id="deleteModalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this todo?</p>
                    <p class="delete-todo-title" id="deleteTodoTitle"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="deleteModalCancel">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteModalConfirm">Delete</button>
                </div>
            </div>
        </div>

        <!-- All Emotions Modal -->
        <div class="modal hidden" id="allEmotionsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>All Available Emotions</h3>
                    <button class="modal-close" id="emotionsModalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="emotions-grid" id="emotionsGrid">
                        <!-- Emotions will be dynamically inserted here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="emotionsModalClose2">Close</button>
                </div>
            </div>
        </div>

        <!-- Loading indicator -->
        <div class="loading hidden" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Error/Success messages -->
        <div class="message hidden" id="messageContainer">
            <div class="message-content" id="messageContent"></div>
            <button class="message-close" id="messageClose">&times;</button>
        </div>
    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
    <script src="src/js/config.js"></script>
    <script src="src/js/auth.js"></script>
    <script src="src/js/emote-auth.js"></script>
    <script src="src/js/api.js"></script>
    <script src="src/js/todos.js"></script>
    <script src="src/js/ui.js"></script>
    <script src="src/js/dashboard.js"></script>
</body>
</html>
